<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTrack — School Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ===================== DESIGN TOKENS ===================== */
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1c2537;
    --border: rgba(255,255,255,0.07);
    --text: #f0f4ff;
    --muted: #7b8db0;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);

    /* Role colors */
    --teacher-h: 220;
    --learner-h: 158;
    --parent-h: 280;
    --admin-h: 25;

    --accent: #4f8ef7;
    --accent-soft: rgba(79,142,247,0.15);
    --accent-glow: rgba(79,142,247,0.3);
  }

  /* Role-specific accent overrides */
  body[data-role="learner"] { --accent: #10e89b; --accent-soft: rgba(16,232,155,0.12); --accent-glow: rgba(16,232,155,0.25); }
  body[data-role="parent"]  { --accent: #c084fc; --accent-soft: rgba(192,132,252,0.12); --accent-glow: rgba(192,132,252,0.25); }
  body[data-role="admin"]   { --accent: #fb923c; --accent-soft: rgba(251,146,60,0.12);  --accent-glow: rgba(251,146,60,0.25); }
  body[data-role="teacher"] { --accent: #4f8ef7; --accent-soft: rgba(79,142,247,0.12);  --accent-glow: rgba(79,142,247,0.25); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: --accent var(--transition);
  }

  /* ===================== UTILITY ===================== */
  .hidden { display: none !important; }
  .flex { display: flex; }
  .items-center { align-items: center; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .text-accent { color: var(--accent); }
  .text-muted { color: var(--muted); }
  .font-bold { font-weight: 700; }

  /* ===================== SCROLLBAR ===================== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  /* ===================== LOGIN PAGE ===================== */
  #login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
  }

  .login-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .login-bg::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    top: -200px; right: -200px;
    transition: all 0.8s ease;
    animation: floatBg 6s ease-in-out infinite;
  }
  .login-bg::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    bottom: -100px; left: -100px;
    transition: all 0.8s ease;
    animation: floatBg 8s ease-in-out infinite reverse;
  }

  @keyframes floatBg {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(20px,30px) scale(1.05); }
  }

  /* Grid lines bg */
  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
  }

  .login-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    background: rgba(17,24,39,0.85);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--shadow), 0 0 60px var(--accent-glow);
    transition: box-shadow var(--transition);
    animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    box-shadow: 0 0 20px var(--accent-glow);
    transition: background var(--transition), box-shadow var(--transition);
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); transition: color var(--transition); }

  /* Role Tabs */
  .role-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 5px;
    margin-bottom: 28px;
  }

  .role-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 6px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    transition: all var(--transition);
  }

  .role-tab i { font-size: 16px; }

  .role-tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 15px var(--accent-glow);
    transform: translateY(-1px);
  }

  .role-tab:not(.active):hover {
    background: var(--surface2);
    color: var(--text);
  }

  .login-title {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .login-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  .input-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px 12px 40px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: all var(--transition);
  }

  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .input-wrap input::placeholder { color: var(--muted); }

  .forgot { text-align: right; margin-top: -10px; margin-bottom: 20px; }
  .forgot a { font-size: 13px; color: var(--accent); text-decoration: none; }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 4px 20px var(--accent-glow);
    letter-spacing: 0.3px;
  }

  .btn-login:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 6px 25px var(--accent-glow);
  }

  .btn-login:active { transform: translateY(0); }

  .register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }

  .register-link a { color: var(--accent); text-decoration: none; font-weight: 500; }

  /* ===================== APP SHELL ===================== */
  #app { display: none; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform var(--transition);
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo .logo-icon { width: 36px; height: 36px; font-size: 16px; border-radius: 10px; }
  .sidebar-logo .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }

  .sidebar-user {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 0 12px var(--accent-glow);
    transition: background var(--transition), box-shadow var(--transition);
  }

  .sidebar-user-info { flex: 1; min-width: 0; }
  .sidebar-user-info .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user-info .role-badge {
    font-size: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    transition: background var(--transition), color var(--transition);
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px;
  }

  .nav-section-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 8px 4px;
    margin-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    transition: all var(--transition);
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .nav-item i { width: 16px; text-align: center; font-size: 14px; }

  .nav-item:hover { background: var(--surface2); color: var(--text); }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .nav-item .badge {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 20px;
    font-weight: 700;
  }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .sidebar-footer button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all var(--transition);
  }

  .sidebar-footer button:hover { background: rgba(220,38,38,0.1); color: #ef4444; }

  /* Main Content */
  .main-content {
    margin-left: 240px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Topbar */
  .topbar {
    position: sticky;
    top: 0;
    background: rgba(10,15,30,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 50;
  }

  .topbar-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    flex: 1;
  }

  .topbar-search {
    position: relative;
  }

  .topbar-search input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 8px 16px 8px 36px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    width: 200px;
    transition: all var(--transition);
    font-family: 'DM Sans', sans-serif;
  }

  .topbar-search input:focus { border-color: var(--accent); width: 240px; }
  .topbar-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }

  .topbar-btn {
    width: 38px; height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    transition: all var(--transition);
    position: relative;
  }

  .topbar-btn:hover { border-color: var(--accent); color: var(--accent); }

  .notif-dot {
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--bg);
  }

  /* Dashboard Body */
  .page { padding: 28px; display: none; }
  .page.active { display: block; animation: fadeIn 0.4s ease both; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: transform var(--transition), box-shadow var(--transition);
    cursor: default;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    transition: background var(--transition);
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3), 0 0 20px var(--accent-glow);
  }

  .stat-card .stat-icon {
    width: 44px; height: 44px;
    background: var(--accent-soft);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 14px;
    transition: background var(--transition), color var(--transition);
  }

  .stat-card .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-card .stat-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .stat-card .stat-change {
    position: absolute;
    top: 16px; right: 16px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .stat-change.up { background: rgba(16,185,129,0.15); color: #10b981; }
  .stat-change.down { background: rgba(239,68,68,0.15); color: #ef4444; }

  /* Grid layouts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    transition: border-color var(--transition);
  }

  .card:hover { border-color: var(--accent-soft); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
  }

  .card-action {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: opacity var(--transition);
  }

  .card-action:hover { opacity: 0.7; }

  /* Chart container */
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap-sm { position: relative; height: 160px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 10px 14px;
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--text);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody tr:last-child td { border-bottom: none; }

  /* Status badges */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-green { background: rgba(16,185,129,0.15); color: #10b981; }
  .badge-red   { background: rgba(239,68,68,0.15);  color: #ef4444; }
  .badge-yellow{ background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge-blue  { background: rgba(79,142,247,0.15); color: #4f8ef7; }
  .badge-purple{ background: rgba(192,132,252,0.15);color: #c084fc; }
  .badge-orange{ background: rgba(251,146,60,0.15); color: #fb923c; }

  /* Progress bar */
  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 10px;
    transition: width 1s ease, background var(--transition);
  }

  /* Attendance dots */
  .attendance-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
  }
  .att-dot {
    width: 18px; height: 18px;
    border-radius: 4px;
  }
  .att-present { background: #10b981; }
  .att-absent  { background: #ef4444; }
  .att-late    { background: #fbbf24; }
  .att-holiday { background: var(--surface2); }

  /* Notifications panel */
  .notif-list { display: flex; flex-direction: column; gap: 12px; }
  .notif-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--accent);
    transition: background var(--transition);
  }
  .notif-item:hover { background: rgba(255,255,255,0.05); }
  .notif-icon {
    width: 32px; height: 32px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .notif-content .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .notif-content .desc  { font-size: 12px; color: var(--muted); }
  .notif-time { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* Event items */
  .event-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .event-item:last-child { border-bottom: none; }
  .event-date {
    width: 44px;
    text-align: center;
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 6px;
    flex-shrink: 0;
  }
  .event-date .day { font-size: 18px; font-weight: 800; font-family: 'Syne', sans-serif; color: var(--accent); }
  .event-date .month { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .event-info .name { font-size: 13px; font-weight: 600; }
  .event-info .time { font-size: 12px; color: var(--muted); }

  /* Message thread */
  .message-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: all var(--transition);
  }
  .message-item:hover { padding-left: 8px; }
  .message-item .msg-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;

  .subject-chip .subj { font-size: 11px; color: var(--muted); margin-top: 2px; }

    transition: transform var(--transition);

  .achievement .ach-name { font-size: 10px; color: var(--muted); text-align: center; }

  /* Responsive */

function selectRole(btn) {
  currentRole = btn.dataset.role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.body.dataset.role = currentRole;
  document.getElementById('roleLabel').textContent = btn.textContent.trim();

  const adminRoles = ['teacher', 'admin'];
  document.getElementById('registerLink').style.display = adminRoles.includes(currentRole) ? 'none' : '';
}

function doLogin() {
  const email = document.getElementById('loginEmail').value;
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initApp();
}

function doLogout() {
  destroyAllCharts();
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ===================== APP INIT =====================
function initApp() {
  const cfg = roleConfig[currentRole];
  document.body.dataset.role = currentRole;

  // Sidebar user info
  document.getElementById('sidebarAvatar').textContent = cfg.initials;
  document.getElementById('topbarAvatar').textContent = cfg.initials;
  document.getElementById('sidebarName').textContent = cfg.name;
  document.getElementById('sidebarRole').textContent = cfg.label;

  // Sidebar nav
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  cfg.nav.forEach(item => {
    if (item.section) {
      nav.innerHTML += `<div class="nav-section-title">${item.section}</div>`;
    } else {
      nav.innerHTML += `
        <button class="nav-item" id="nav-${item.id}" onclick="navigate('${item.id}')">
          <i class="fas ${item.icon}"></i>
          ${item.label}
          ${item.badge ? `<span class="badge">${item.badge}</span>` : ''}
        </button>`;
    }
  });

  navigate(cfg.defaultPage);
}

function navigate(pageId) {
  // Hide all pages
  document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const pageEl = document.getElementById(`page-${pageId}`);
  if (pageEl) {
    pageEl.classList.add('active');
    pageEl.style.display = 'block';
  }
  const navEl = document.getElementById(`nav-${pageId}`);
  if (navEl) navEl.classList.add('active');

  // Set title
  const titles = {
    'teacher-dashboard': 'Dashboard', 'teacher-attendance': 'Attendance',
    'teacher-gradebook': 'Gradebook', 'teacher-resources': 'Resources',
    'teacher-messages': 'Messages', 'teacher-analytics': 'Analytics',
    'learner-dashboard': 'Dashboard', 'learner-progress': 'My Progress',
    'learner-resources': 'Resources', 'learner-achievements': 'Achievements',
    'learner-timetable': 'Timetable',
    'parent-dashboard': 'Dashboard', 'parent-reports': 'Academic Reports',
    'parent-payments': 'Payments', 'parent-events': 'Events',
    'parent-messages': 'Messages',
    'admin-dashboard': 'Dashboard', 'admin-users': 'User Management',
    'admin-finance': 'Finance', 'admin-analytics': 'Analytics',
    'admin-announcements': 'Announcements', 'admin-audit': 'Audit Logs',
  };
  document.getElementById('topbarTitle').textContent = titles[pageId] || 'Dashboard';

  // Render page content
  currentPage = pageId;
  renderPage(pageId);
}

function destroyAllCharts() {
  Object.keys(charts).forEach(k => { if (charts[k]) { charts[k].destroy(); delete charts[k]; } });
}

function renderPage(pageId) {
  const el = document.getElementById(`page-${pageId}`);
  if (!el || el.dataset.rendered) return;
  el.dataset.rendered = '1';

  const renderer = pageRenderers[pageId];
  if (renderer) renderer(el);
}

// ===================== CHART HELPERS =====================
const chartDefaults = {
  plugins: { legend: { labels: { color: '#7b8db0', font: { family: 'DM Sans' } } } },
  scales: {
    x: { ticks: { color: '#7b8db0' }, grid: { color: 'rgba(255,255,255,0.04)' } },
    y: { ticks: { color: '#7b8db0' }, grid: { color: 'rgba(255,255,255,0.04)' } }
  }
};

function getAccent() {
  return getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#4f8ef7';
}

function makeBarChart(id, labels, datasets, opts={}) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) charts[id].destroy();
  const accent = getAccent();
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: { ...chartDefaults, responsive: true, maintainAspectRatio: false, ...opts }
  });
}

function makeLineChart(id, labels, datasets, opts={}) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: { ...chartDefaults, responsive: true, maintainAspectRatio: false, elements: { point: { radius: 3 } }, ...opts }
  });
}

function makeDoughnutChart(id, labels, data, colors) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '70%',
      plugins: { legend: { position: 'right', labels: { color: '#7b8db0', font: { family: 'DM Sans' }, boxWidth: 12, padding: 16 } } }
    }
  });
}

        <div class="stat-change down">↓ 2%</div>

// ===================== HELPERS =====================
function animateCounters(el) {
  el.querySelectorAll('.counter').forEach(c => {
    const target = parseInt(c.dataset.target);
    let current = 0;
    const step = Math.ceil(target / 40);
    const interval = setInterval(() => {
      current = Math.min(current + step, target);
      c.textContent = current.toLocaleString();
      if (current >= target) clearInterval(interval);
    }, 30);
  });
}

function markAll(status) {
  document.querySelectorAll(`#attendanceBody input[value="${status}"]`).forEach(r => r.checked = true);
}

function selectTerm(btn) {
  btn.closest('div').querySelectorAll('.btn').forEach(b => {

}

function filterResources(btn) { selectTerm(btn); }
function filterUsers(btn) { selectTerm(btn); }
function filterLogs(btn) { selectTerm(btn); }
